{{ $research := .Site.Data.research }}
<section id="research" class="section">
  <div class="container">
    <div class="section-shell">
      <div class="section-head">
        <h2>{{ $research.title }}</h2>
        <h3 class="muted">{{ $research.subtitle }}</h3>
      </div>
      <div class="research-grid">
        {{ range where .Site.RegularPages "Section" "research" }}
        <a class="card research-card" href="{{ .RelPermalink }}">
          <h3>{{ .Title }}</h3>
          <p>{{ .Description }}</p>
        </a>
        {{ end }}
      </div>
    </div>
  </div>
</section>
