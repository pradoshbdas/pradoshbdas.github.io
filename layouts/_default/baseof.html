<!DOCTYPE html>
<html lang="en" data-theme="dark" data-portfolio-page="{{ if .IsHome }}home{{ else if eq .Section "" }}other{{ else }}{{ .Section }}{{ end }}">
<head>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  {{ partial "head.html" . }}
  <script>
    // This runs in <head>, before any content is painted.
    // The solar introduction belongs ONLY to the first homepage visit of this tab.
    (function () {
      var isHome = {{ if .IsHome }}true{{ else }}false{{ end }};
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var alreadySeen = false;
      try { alreadySeen = sessionStorage.getItem('pradosh-intro-seen') === '1'; } catch (_) {}
      var playIntro = isHome && !reduced && !alreadySeen;
      if (playIntro) {
        // Mark BEFORE starting animation: page changes/reloads cannot replay it.
        try { sessionStorage.setItem('pradosh-intro-seen', '1'); } catch (_) {}
        document.documentElement.classList.add('play-intro');
      } else {
        document.documentElement.classList.add('skip-intro');
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/page-transitions.css" />
</head>
<body class="loading">
 <!-- Optimized animated background on all pages -->
<div id="bg-media" aria-hidden="true">
  <video
    id="background-video"
    muted
    loop
    playsinline
    preload="none"
    tabindex="-1">
  </video>
</div>
</div>
  {{ if .IsHome }}{{ partial "loader.html" . }}{{ end }}
  {{ block "body" . }}{{ end }}
  {{ partial "scripts.html" . }}
  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
  ↑
</button>
</body>
</html>
