<text x="75" y="104" fill="#e7effe" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Gaia-ESO · HR15N spectral window</text>
<text x="75" y="141" fill="#a9bed8" font-family="Arial,sans-serif" font-size="19">Ba II and Eu II neutron-capture diagnostics</text>
<line x1="75" y1="320" x2="940" y2="320" stroke="#adc4e0" stroke-width="2"/>
<line x1="98.1" y1="313" x2="98.1" y2="328" stroke="#7795bb"/>
<text x="98.1" y="354" fill="#9eafc8" font-size="15" text-anchor="middle" font-family="Arial,sans-serif">6450</text>
<line x1="213.4" y1="313" x2="213.4" y2="328" stroke="#7795bb"/>
<text x="213.4" y="354" fill="#9eafc8" font-size="15" text-anchor="middle" font-family="Arial,sans-serif">6500</text>
