<text x="328.7" y="354" fill="#9eafc8" font-size="15" text-anchor="middle" font-family="Arial,sans-serif">6550</text>
<line x1="444.1" y1="313" x2="444.1" y2="328" stroke="#7795bb"/>
<text x="444.1" y="354" fill="#9eafc8" font-size="15" text-anchor="middle" font-family="Arial,sans-serif">6600</text>
<line x1="559.4" y1="313" x2="559.4" y2="328" stroke="#7795bb"/>
<text x="559.4" y="354" fill="#9eafc8" font-size="15" text-anchor="middle" font-family="Arial,sans-serif">6650</text>
<line x1="674.7" y1="313" x2="674.7" y2="328" stroke="#7795bb"/>
<text x="674.7" y="354" fill="#9eafc8" font-size="15" text-anchor="middle" font-family="Arial,sans-serif">6700</text>
<line x1="790.1" y1="313" x2="790.1" y2="328" stroke="#7795bb"/>
