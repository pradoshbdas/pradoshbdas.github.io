<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Gaia-ESO HR15N spectral range</title>
<desc id="desc">Schematic of the HR15N spectral window from 6440 to 6815 angstroms, marking barium and europium absorption-line wavelengths. This is not a measured stellar spectrum.</desc>
